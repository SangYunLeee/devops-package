x-environment: &backend-env
  DEBUG: "0"
  DJANGO_SETTINGS_MODULE: plane.settings.production
  DATABASE_URL: postgresql://plane:plane@postgres:5432/plane
  REDIS_URL: redis://redis:6379/
  CELERY_BROKER_URL: redis://redis:6379/0
  SECRET_KEY: change-this-secret-key-in-production
  USE_MINIO: "1"
  AWS_ACCESS_KEY_ID: plane
  AWS_SECRET_ACCESS_KEY: planeminio
  AWS_S3_ENDPOINT_URL: http://minio:9000
  AWS_S3_BUCKET_NAME: uploads
  ADMIN_EMAIL: admin@plane.local
  ADMIN_PASSWORD: admin123
  ENABLE_SIGNUP: "1"
  ENABLE_EMAIL_PASSWORD: "1"
  ENABLE_MAGIC_LINK_LOGIN: "0"
  IS_SELF_MANAGED: "1"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane
      POSTGRES_DB: plane
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane -d plane"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: plane
      MINIO_ROOT_PASSWORD: planeminio
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  init-minio:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 plane planeminio;
      mc mb myminio/uploads --ignore-existing;
      mc anonymous set download myminio/uploads;
      "

  init-db:
    image: makeplane/plane-backend:latest
    environment:
      <<: *backend-env
    volumes:
      - ./init-superuser.py:/code/init-superuser.py:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "python manage.py migrate --noinput && python manage.py shell < /code/init-superuser.py"]

  plane-api:
    image: makeplane/plane-backend:latest
    command: ./bin/docker-entrypoint-api.sh
    environment:
      <<: *backend-env
      CORS_ALLOWED_ORIGINS: "http://localhost"
      WEB_URL: "http://localhost"
      GUNICORN_WORKERS: "2"
      FILE_SIZE_LIMIT: "5242880"
    depends_on:
      init-db:
        condition: service_completed_successfully

  plane-worker:
    image: makeplane/plane-backend:latest
    command: ./bin/docker-entrypoint-worker.sh
    environment:
      <<: *backend-env
    depends_on:
      init-db:
        condition: service_completed_successfully

  plane-beat:
    image: makeplane/plane-backend:latest
    command: ./bin/docker-entrypoint-beat.sh
    environment:
      <<: *backend-env
    depends_on:
      init-db:
        condition: service_completed_successfully

  plane-web:
    image: makeplane/plane-frontend:latest
    command: node /app/web/server.js
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_PUBLIC_DEPLOY_URL: "http://localhost"
    depends_on:
      - plane-api

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - plane-web
      - plane-api

volumes:
  postgres-data:
  redis-data:
  minio-data:
